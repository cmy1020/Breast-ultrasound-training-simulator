# 乳腺超声扫查基础知识库
# 每一条包含: keywords (触发词), question (标准问法), answer (回答)

- keywords: [BI-RADS, BIRADS, 分级, 分类, 评估, 报告]
  question: 什么是 BI-RADS 分级？
  answer: |
    <b>BI-RADS</b>（Breast Imaging Reporting and Data System）是乳腺影像报告和数据系统，由美国放射学会（ACR）制定，用于标准化乳腺影像报告的描述和评估结论。

    <b>0 级：</b>评估不完整，需要进一步影像学检查。
    <b>1 级：</b>阴性，常规随访。
    <b>2 级：</b>良性发现，常规随访。
    <b>3 级：</b>可能良性，建议短期随访（6个月）。
    <b>4 级：</b>可疑异常，建议活检。4A（低度可疑）、4B（中度可疑）、4C（高度可疑）。
    <b>5 级：</b>高度提示恶性，必须活检。
    <b>6 级：</b>已活检证实的恶性病变。

    超声医师需要在报告中准确使用 BI-RADS 分级。

- keywords: [探头, 握持, 手法, 拿探头, 持探头, 扫查手法]
  question: 超声探头应该如何握持？
  answer: |
    <b>探头握持要点：</b>

    1. <b>握持姿势：</b>用拇指和其余四指握住探头柄部，手掌根部轻放于患者皮肤上作为支点，保持手腕放松。
    2. <b>力度控制：</b>探头与皮肤接触力度适中——过轻导致耦合不良、图像模糊；过重会压迫乳腺组织、改变病灶形态和血流信号。
    3. <b>耦合剂：</b>足量涂抹，确保探头与皮肤之间无气泡。
    4. <b>稳定性：</b>手掌根部始终接触患者皮肤，提供稳定的支撑，避免探头滑动或晃动。
    5. <b>扫查方向：</b>始终保持探头与扫查平面垂直，避免倾斜造成的各向异性伪像。

- keywords: [解剖, 层次, 结构, 皮肤, 脂肪, 腺体, 胸肌, 乳腺解剖]
  question: 乳腺超声的正常解剖层次是什么？
  answer: |
    乳腺超声从浅到深可识别以下层次结构：

    1. <b>皮肤层：</b>呈高回声线状，厚度约 2-3 mm。
    2. <b>皮下脂肪层：</b>低回声，内含 Cooper 韧带（条索状高回声）。
    3. <b>腺体层：</b>中等回声，乳腺实质，呈斑片状或网状分布。
    4. <b>乳腺后脂肪层：</b>低回声，位于腺体与胸肌之间。
    5. <b>胸大肌：</b>低回声，肌纤维纹理呈平行线状排列。
    6. <b>肋骨：</b>强回声伴后方声影。
    7. <b>胸膜：</b>高回声线状，随呼吸运动。

    理解正常的解剖层次是识别异常病变的基础。

- keywords: [扫查, 顺序, 切面, 放射状, 反放射状, 标准切面, 扫查方式]
  question: 乳腺超声的扫查顺序是什么？
  answer: |
    标准乳腺超声扫查通常采用以下步骤：

    1. <b>放射状扫查（Radial）：</b>以乳头为中心，探头沿放射状方向（如车轮辐条）移动。优势：沿乳腺导管走行方向成像，有利于观察导管扩张和导管内病变。
    2. <b>反放射状扫查（Anti-radial）：</b>探头沿垂直于放射状方向（如车轮轮圈切线方向）移动。优势：提供与放射状扫查正交的切面，用于验证可疑发现。
    3. <b>四象限全面扫查：</b>按外上、外下、内上、内下四个象限依次扫查，确保每个象限都覆盖。
    4. <b>钟面定位法：</b>以钟面位置（如"左乳 10 点钟方向，距乳头 3 cm"）记录病灶位置。
    5. <b>扫查速度：</b>缓慢、均匀，每个位置停留 2-3 秒，确保图像稳定。

- keywords: [良性, 恶性, 鉴别, 区分, 良性恶性, 诊断标准]
  question: 如何通过超声鉴别乳腺病灶的良恶性？
  answer: |
    乳腺病灶良恶性超声鉴别要点：

    <table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse; width:100%">
    <tr style="background:#3a3a3a"><th>特征</th><th>良性</th><th>恶性</th></tr>
    <tr><td>形态</td><td>规则（圆形/椭圆形）</td><td>不规则、分叶状</td></tr>
    <tr><td>边界</td><td>清晰、光滑</td><td>模糊、毛刺状、蟹足状</td></tr>
    <tr><td>纵横比</td><td>&lt; 1（平行于皮肤）</td><td>&gt; 1（垂直于皮肤）</td></tr>
    <tr><td>后方回声</td><td>增强或无变化</td><td>衰减（后方声影）</td></tr>
    <tr><td>内部回声</td><td>均匀</td><td>不均匀、低回声</td></tr>
    <tr><td>钙化</td><td>粗大钙化</td><td>微小钙化（&lt;0.5mm）</td></tr>
    <tr><td>血流信号</td><td>少或无</td><td>丰富、阻力指数高</td></tr>
    <tr><td>周围组织</td><td>无改变</td><td>结构扭曲、导管扩张</td></tr>
    </table>

    ⚠️ 超声仅为筛查手段，确诊需结合钼靶、MRI 及穿刺活检。

- keywords: [病灶, 特征, 描述, 形态, 边界, 回声, 钙化]
  question: 描述乳腺病灶时需要关注哪些特征？
  answer: |
    乳腺超声报告中描述病灶的标准要素：

    1. <b>大小：</b>三个径线（长×宽×高），以 mm 为单位。
    2. <b>形态：</b>椭圆形、圆形、不规则形。
    3. <b>方位（纵横比）：</b>平行于皮肤（良性倾向）或垂直于皮肤（恶性倾向）。
    4. <b>边界：</b>清晰、模糊、毛刺状、微分叶状。
    5. <b>回声：</b>无回声、低回声、等回声、高回声、混合回声、囊实性。
    6. <b>后方回声特征：</b>增强、衰减、声影、无变化。
    7. <b>钙化：</b>粗大钙化（>0.5mm）、微小钙化（<0.5mm）。
    8. <b>血供：</b>彩色多普勒评估内部及周边血流信号。

    这八个要素构成了完整的超声病灶描述模板。

- keywords: [多普勒, 血流, 彩色, CDFI, 血管, 阻力指数]
  question: 彩色多普勒在乳腺超声中有什么作用？
  answer: |
    彩色多普勒（CDFI）用于评估乳腺病灶的血供情况：

    1. <b>血流分级：</b>
       - 0 级：无血流信号
       - 1 级：少量血流（1-2 个点状或短棒状血流）
       - 2 级：中量血流（3-4 个点状血流或 1 条较长的血管）
       - 3 级：丰富血流（>4 条血管或网状血流）

    2. <b>血流分布模式：</b>周边型、内部型、穿入型。

    3. <b>频谱多普勒参数：</b>
       - 收缩期峰值流速（PSV）
       - 阻力指数（RI）= (PSV - EDV) / PSV
       - 恶性病灶 RI 通常 > 0.7

    4. <b>临床意义：</b>恶性肿瘤血管生成增加，血流更丰富，但 CDFI 不能单独判断良恶性，需结合二维灰阶超声综合评估。

- keywords: [囊肿, 囊性, 囊实性, 纤维腺瘤, 增生, 乳腺病]
  question: 乳腺常见的良性病变有哪些？
  answer: |
    乳腺常见良性病变及超声特征：

    1. <b>单纯性囊肿：</b>圆形/椭圆形，边界清晰，内部无回声，后方回声增强，侧方声影。符合 BI-RADS 2 级。

    2. <b>纤维腺瘤：</b>育龄妇女最常见良性肿瘤。椭圆形、边界清晰、低回声、平行于皮肤、后方回声正常或增强。符合 BI-RADS 3 级。

    3. <b>乳腺增生症（乳腺病）：</b>弥漫性腺体增厚、回声不均、多发小囊或导管扩张。导管周围间质增厚。

    4. <b>导管内乳头状瘤：</b>扩张导管内的实性结节，边界清晰，可伴导管扩张。

    5. <b>脂肪瘤：</b>椭圆形高回声（比腺体亮），边界清晰，可变形。

    6. <b>乳腺炎/脓肿：</b>边界不清的低回声区，可能有液性暗区，血流丰富，伴皮肤增厚水肿。

- keywords: [探头, 频率, 高频, 变频, 参数, 调节, 增益, 深度, 聚焦]
  question: 乳腺超声检查时如何调节设备参数？
  answer: |
    乳腺超声检查的常用设备参数设置：

    1. <b>探头频率：</b>使用高频线阵探头，推荐 7.5-18 MHz。频率越高分辨率越好但穿透力越差。乳腺位置表浅，适合高频。
    2. <b>深度（Depth）：</b>调节至刚好能看到胸大肌及其后方胸膜线即可。通常 3-5 cm。
    3. <b>增益（Gain）：</b>使腺体层显示为中等灰度的均匀回声。增益过高图像泛白、细节丢失；增益过低图像昏暗无法观察。
    4. <b>时间增益补偿（TGC）：</b>补偿声波随深度衰减的能量。浅部和深部亮度应均匀一致。
    5. <b>聚焦带（Focus）：</b>放置在病灶或目标区域所在深度。多个聚焦带可改善图像清晰度。
    6. <b>动态范围（Dynamic Range）：</b>通常设为 60-70 dB，影响组织层次对比度。
    7. <b>帧频：</b>适当调整以保持实时成像流畅。

- keywords: [伪像, 伪影, 各向异性, 声影, 旁瓣, 混响]
  question: 乳腺超声常见的伪像有哪些？
  answer: |
    乳腺超声常见伪像及应对策略：

    1. <b>各向异性伪像：</b>探头未垂直于目标结构时，回声反射减弱。常见于韧带、筋膜。处理：调整探头角度，使声束垂直于结构。

    2. <b>后方声影：</b>强反射或强吸收结构后方无回声。常见于钙化、肋骨。注意区分病灶后方的恶性声影与良性声影。

    3. <b>后方回声增强：</b>液性结构（囊肿）后方回声增强，是囊性结构的重要鉴别特征。

    4. <b>混响伪像（Reverberation）：</b>声束在探头和强反射界面之间来回反射。常见于浅表筋膜层。处理：增加耦合剂或调整探头压力。

    5. <b>旁瓣伪像：</b>探头旁瓣产生的额外声束，在液性暗区内产生假性回声。减小增益或移动探头可减轻。

    6. <b>镜像伪像：</b>强反射界面（如胸膜）产生的镜面效应。典型的镜像伪像有助于判断胸膜完整性。

- keywords: [BI-RADS 3, BI-RADS 4, 随访, 间隔, 频率, 复查]
  question: 超声 BI-RADS 3 级和 4 级应该如何处理？
  answer: |
    根据 BI-RADS 分级的管理建议：

    <b>BI-RADS 3 级（可能良性）：</b>
    - 恶性概率 < 2%
    - 建议方案：<b>6 个月后复查</b>，之后每 6-12 个月连续随访 2-3 年
    - 若病灶稳定或缩小，可降级至 BI-RADS 2
    - 若病灶增大或形态恶化，升级至 BI-RADS 4 并建议活检

    <b>BI-RADS 4 级（可疑恶性）：</b>
    - 恶性概率 2%-95%
    - <b>必须进行活检</b>（空心针穿刺或真空辅助旋切）
    - 4A 级：恶性概率 2-10%，建议活检
    - 4B 级：恶性概率 10-50%，建议活检
    - 4C 级：恶性概率 50-95%，高度建议活检

    ⚠️ 以上为通用指南，具体管理决策需结合患者年龄、家族史、临床症状等综合因素。

- keywords: [乳腺癌, 表现, 超声表现, 导管癌, 浸润性, 原位癌]
  question: 乳腺癌的典型超声表现是什么？
  answer: |
    乳腺癌常见超声表现：

    1. <b>浸润性导管癌（IDC，最常见）：</b>
       - 形态不规则、边界模糊或毛刺状
       - 低回声、不均匀
       - 纵横比 > 1（垂直于皮肤方向生长）
       - 后方回声衰减
       - 可有微小钙化
       - 血供丰富，阻力指数升高

    2. <b>导管原位癌（DCIS）：</b>
       - 导管扩张伴腔内低回声充填
       - 沿导管分布的微钙化
       - 可无明显肿块

    3. <b>浸润性小叶癌：</b>
       - 弥漫性浸润，超声表现不典型
       - 局部结构扭曲，但无明确边界清晰的肿块
       - 容易漏诊

    4. <b>炎性乳癌：</b>
       - 皮肤弥漫性增厚、水肿
       - 皮下淋巴管扩张
       - 可能无明确肿块

    ⚠️ 任何新发现的可疑病灶都应及时建议进一步的影像学和组织学检查。

- keywords: [弹性成像, 弹性, 硬度, strain, shear wave, 剪切波]
  question: 超声弹性成像在乳腺检查中有什么价值？
  answer: |
    超声弹性成像评估组织硬度，为乳腺病灶评估提供辅助信息：

    1. <b>应变弹性成像（Strain Elastography）：</b>
       - 手动施加压力，比较病灶与周围组织的应变差异
       - 恶性组织通常更"硬"、形变更小
       - 弹性评分（Itoh 5 分法）：1-3 分为良性倾向，4-5 分为恶性倾向

    2. <b>剪切波弹性成像（Shear Wave Elastography）：</b>
       - 定量测量组织弹性模量（kPa 或 m/s）
       - Emax（最大弹性值）是最常用的诊断参数
       - 一般 Emax > 80-120 kPa 提示恶性风险增高
       - 不同研究阈值不同，需结合本单位设备校准参考范围

    3. <b>临床应用价值：</b>
       - 提高 BI-RADS 3 和 4 级病灶的鉴别准确度
       - 减少不必要的良性活检
       - 作为灰阶超声的补充手段，不能替代灰阶超声

- keywords: [哺乳, 孕期, 妊娠, 母乳, 孕妇]
  question: 妊娠期和哺乳期乳腺超声有何特殊注意事项？
  answer: |
    妊娠期和哺乳期乳腺超声特点：

    1. <b>生理变化：</b>腺体显著增生，回声增粗、回声增强，导管扩张，脂肪层变薄。整体回声变强，辨别力下降。

    2. <b>扫查技巧：</b>
       - 探头频率可适当降低（7.5-12 MHz），增加穿透力
       - 调整增益和 TGC 补偿增粗的腺体回声
       - 告知患者乳腺充血感为正常状态

    3. <b>常见病变：</b>
       - 积乳囊肿：圆形/椭圆形、内部有回声（乳汁）、后方增强
       - 乳腺炎：压痛、红肿、弥漫性回声改变
       - 哺乳期腺瘤：与纤维腺瘤超声表现相似，产后自行消退

    4. <b>安全提示：</b>
       - 超声检查对孕妇和哺乳期女性完全安全（无电离辐射）
       - 哺乳后扫查有助于排空乳腺，改善图像质量

- keywords: [腋窝, 淋巴结, 转移, 淋巴, 腋下]
  question: 乳腺超声检查时需要扫查腋窝吗？
  answer: |
    是的，<b>乳腺超声必须常规扫查腋窝区域</b>。腋窝淋巴结状态是乳腺癌最重要预后因素之一。

    <b>扫查区域：</b>
    - 同侧腋窝（Level I, II, III）
    - 锁骨上窝
    - 内乳区（如探头可达）

    <b>正常淋巴结超声特征：</b>
    - 肾形（豆形）、有淋巴门（高回声脂肪中心）
    - 长径/短径比 > 2
    - 皮质均匀薄层低回声（< 3mm）

    <b>可疑转移淋巴结的超声特征：</b>
    - 形态变圆（长径/短径比 < 2）
    - 淋巴门消失或偏心受压
    - 皮质不均匀增厚（> 3mm 或局灶性膨出）
    - 中央坏死或钙化
    - 血流信号异常（非门部血供、周边型血供）

- keywords: [耦合剂, 凝胶, 耦合, 气泡, 超声介质]
  question: 超声耦合剂的作用和使用注意事项是什么？
  answer: |
    超声耦合剂是超声检查中不可或缺的介质：

    <b>作用：</b>
    1. <b>排除空气：</b>空气是超声波的强反射和衰减介质，探头与皮肤之间的空气间隙会导致 99% 以上的声能被反射，无法形成图像。耦合剂填充这一间隙。
    2. <b>阻抗匹配：</b>耦合剂声阻抗与皮肤组织相近（约 1.5 MRayl），减少声能损失。

    <b>使用注意事项：</b>
    1. 涂抹足够的量覆盖整个扫查区域
    2. 扫查过程中如变干需及时补充
    3. 使用医用无菌耦合剂
    4. 腔内检查（如经阴道）需使用专用无菌耦合剂
    5. 活检时需使用无菌耦合剂，避免污染穿刺针道

    <b>常见错误：</b>
    - 耦合剂太少 → 图像局部不清、线性伪像
    - 耦合剂内气泡 → 点状强回声伪影
    - 耦合剂未覆盖探头边缘 → 扫查范围受限

- keywords: [无菌, 消毒, 清洁, 活检, 穿刺, 探头消毒]
  question: 如何进行超声探头的清洁与消毒？
  answer: |
    超声探头清洁消毒的基本原则：

    <b>低风险操作（常规体表扫查）：低级别消毒</b>
    1. 用干净的软布擦拭探头表面残余耦合剂
    2. 用含季铵盐类消毒剂的湿巾擦拭探头表面，充分湿润（按产品说明作用时间）
    3. 自然晾干或用清洁软布擦干

    <b>中风险操作（破损皮肤、术后切口）：中级别消毒</b>
    1. 使用一次性探头套或无菌保护膜
    2. 操作后按低风险操作清洁
    3. 破坏性操作（如穿刺活检）需使用无菌探头套 + 无菌耦合剂

    <b>注意事项：</b>
    - 禁止使用含酒精的消毒液直接浸泡探头（损坏探头晶片排列）
    - 禁止使用含丙酮、氯仿等有机溶剂
    - 严格执行"一个患者/一个穿刺部位 = 一个探头套"
    - 遵守你所在机构的感控规范

- keywords: [报告, 书写, 模板, 超声报告, 报告模板]
  question: 乳腺超声报告的标准书写模板是什么？
  answer: |
    乳腺超声标准报告应包含以下内容：

    1. <b>患者基本信息：</b>姓名、年龄、检查日期

    2. <b>检查指征（临床病史）：</b>筛查/诊断，触诊异常，疼痛，乳头溢液，家族史等

    3. <b>乳腺超声综合描述：</b>
       - 腺体成分构成（致密/中等/脂肪型）
       - 背景回声（均匀/不均匀）
       - 有无导管扩张

    4. <b>重点异常病灶描述（如有）：</b>
       - 位置（钟面位置 + 距乳头距离）
       - 大小（三个径线，mm）
       - 形态、方位、边界
       - 回声、后方特征
       - 钙化（有无/类型）
       - 血供（CDFI 分级及模式）
       - 弹性成像结果（如有）

    5. <b>腋窝淋巴结评估：</b>有无异常淋巴结

    6. <b>诊断性结论：</b>BI-RADS 分级 + 管理建议

    7. <b>医师签名 + 日期</b>
